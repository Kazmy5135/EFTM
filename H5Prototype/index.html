<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080d0e">
  <title>EFTM · 3D 摄像机 Peek 原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app" aria-label="EFTM 3D 摄像机 Peek 原型">
    <canvas id="sceneCanvas" aria-label="3D 工业通道"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="edge-shadow" aria-hidden="true"></div>

    <header class="top-hud">
      <div>
        <p>H5-PEEK-CAMERA-001</p>
        <h1>通道观察位</h1>
      </div>
      <span class="prototype-badge">视角验证</span>
    </header>

    <section class="state-panel" aria-live="polite">
      <span class="state-dot" aria-hidden="true"></span>
      <div>
        <small>CAMERA STATE</small>
        <strong id="stateLabel">掩体后 · 通道边缘可见</strong>
        <span class="intel-row"><b id="intelState">没有敌人信息</b><em id="visibilityLabel"></em></span>
      </div>
    </section>

    <div id="reticle" class="reticle" aria-hidden="true"><i></i><span></span></div>
    <div id="aimSurface" class="aim-surface" aria-label="拖动中央画面调整准星"></div>

    <section id="instructionCard" class="instruction-card">
      <span class="lean-icon" aria-hidden="true"><i></i></span>
      <div>
        <strong>选择你的探头方式</strong>
        <small>真架枪点击锁定 · 假动作按住探头</small>
      </div>
    </section>

    <div class="peek-progress" aria-hidden="true"><i id="peekProgressFill"></i></div>

    <div id="shotFlash" class="shot-flash" aria-hidden="true"></div>
    <div id="shotResult" class="shot-result" aria-live="polite"></div>

    <button id="fireControl" class="fire-control" type="button" aria-pressed="false" disabled hidden>
      <span>FIRE</span>
      <small>按住射击 · 拖动压枪</small>
    </button>

    <div class="action-row">
      <button id="trueAimControl" class="action-control true-aim-control" type="button" aria-pressed="false">
        <span class="action-symbol" aria-hidden="true">◎</span>
        <span class="button-copy"><strong>真架枪</strong><small>点击锁定</small></span>
      </button>
      <button id="fakePeekControl" class="action-control fake-peek-control" type="button" aria-pressed="false">
        <span class="action-symbol" aria-hidden="true">↗</span>
        <span class="button-copy"><strong>假动作</strong><small>按住探头</small></span>
      </button>
    </div>

    <p class="experiment-note">视角 / 假动作 / 准星射击验证 · 无伤害 / 无弹匣</p>

    <div id="unsupported" class="unsupported" role="alert" hidden>
      <strong>设备无法启动 3D 场景</strong>
      <span id="unsupportedDetail">请确认浏览器已开启 WebGL。</span>
    </div>
  </main>

  <script src="peek-app.js"></script>
</body>
</html>
